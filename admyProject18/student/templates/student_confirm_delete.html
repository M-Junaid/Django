<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>   
</head>
<body>
    <h2>Delete {{ student.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete this student?</p>
        <button type="submit">Yes, delete</button>
        <a href="{% url 'student_list' %}">Cancel</a>
    </form>
</body>
</html>
