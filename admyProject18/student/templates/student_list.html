<!DOCTYPE html>
<html>
<head>
    <title>All Student Data</title>
</head>
<body>
    <h1>All Student Data</h1>
    <a href="{% url 'student_create' %}">Add New Student</a>
    <ul>
        {% for student in students %}
            <li>
                <a href="{% url 'student_detail' student.id %}">{{ student.name }} - {{ student.email }}</a>
            </li>
    
        {% endfor %}
    </ul>
</body>
</html>
