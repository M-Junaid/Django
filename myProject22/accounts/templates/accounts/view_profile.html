{% extends "accounts/base.html" %} {% block content %}
<h2>View profile picture</h2>

<ul>
  {% for profile in profiles %}
  <li>
    {{ profile.name }}<br />
    <img src="{{ profile.image.url }}" alt="{{ profile.name }}" width="200" />
  </li>
  {% empty %}
  <li>No profiles found.</li>
  {% endfor %}
</ul>

{% endblock %}
